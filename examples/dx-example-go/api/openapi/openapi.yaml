openapi: 3.1.0
info:
  title: CDPG teaching example API
  version: 1.0.0
  description: Educational contract; not a registered CDPG service.
paths:
  /iudx/example/v1/widgets:
    post:
      operationId: createWidget
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        "201": {description: Widget created}
        "400": {description: Invalid request}
        "401": {description: Authentication required}
        "403": {description: Access denied}
  /iudx/example/v1/widgets/{id}:
    get:
      operationId: getWidget
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200": {description: Widget returned}
        "401": {description: Authentication required}
        "403": {description: Access denied}
        "404": {description: Widget not found}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
