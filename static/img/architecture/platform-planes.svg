<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">CDPG Go platform planes and boundaries</title>
  <desc id="desc">Clients enter through the gateway. Control, Data, and Agentic Planes use shared Go platform and infrastructure. Solid components are implemented or partial; dashed OPA and carried decisions are planned.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 17px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:13px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.partial{fill:#fff4e8;stroke:#f57e20}.impl{fill:#e7f6ef;stroke:#15805d}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="600" fill="#fff"/><text x="40" y="42" class="t">CDPG Go platform context</text>
  <rect x="40" y="75" width="180" height="74" class="box impl"/><text x="130" y="105" text-anchor="middle" class="h">Clients</text><text x="130" y="130" text-anchor="middle" class="b">users · apps · operators</text>
  <rect x="315" y="75" width="490" height="74" class="box partial"/><text x="560" y="105" text-anchor="middle" class="h">dx-gateway-go · public PEP</text><text x="560" y="130" text-anchor="middle" class="b">OIDC · route posture · workload identity · proxy</text>
  <path d="M220 112H315" class="line"/>
  <rect x="55" y="210" width="310" height="175" class="box partial"/><text x="210" y="242" text-anchor="middle" class="h">Control Plane</text><text x="210" y="272" text-anchor="middle" class="b">user · ACL · authz · catalogue</text><text x="210" y="298" text-anchor="middle" class="b">marketplace · registry · credits</text><text x="210" y="324" text-anchor="middle" class="b">subscriptions · audit · notifications</text><text x="210" y="358" text-anchor="middle" class="b">governance and entitlements</text>
  <rect x="405" y="210" width="310" height="175" class="box partial"/><text x="560" y="242" text-anchor="middle" class="h">Data Plane</text><text x="560" y="272" text-anchor="middle" class="b">files · NGSI-LD · OGC</text><text x="560" y="298" text-anchor="middle" class="b">PostGIS · Elasticsearch · objects</text><text x="560" y="324" text-anchor="middle" class="b">safe query and delivery</text><rect x="470" y="340" width="180" height="28" class="box plan"/><text x="560" y="359" text-anchor="middle" class="b">carried decision</text>
  <rect x="755" y="210" width="310" height="175" class="box partial"/><text x="910" y="242" text-anchor="middle" class="h">Agentic Plane</text><text x="910" y="272" text-anchor="middle" class="b">registry · runtime · MCP gateway</text><text x="910" y="298" text-anchor="middle" class="b">delegation · HITL · kill switch</text><text x="910" y="324" text-anchor="middle" class="b">local integration; GitOps gap</text><rect x="835" y="340" width="150" height="28" class="box plan"/><text x="910" y="359" text-anchor="middle" class="b">OPA guardrails</text>
  <path d="M470 149L260 210" class="line"/><path d="M560 149V210" class="line"/><path d="M650 149L860 210" class="line"/>
  <rect x="120" y="430" width="420" height="82" class="box impl"/><text x="330" y="461" text-anchor="middle" class="h">dx-common-go/platform</text><text x="330" y="487" text-anchor="middle" class="b">bootstrap · transports · SQL · events · identity · health</text>
  <rect x="580" y="430" width="420" height="82" class="box impl"/><text x="790" y="461" text-anchor="middle" class="h">Shared infrastructure</text><text x="790" y="487" text-anchor="middle" class="b">Keycloak · OpenFGA · PostgreSQL · RMQ · Redis · ES · S3</text>
  <path d="M210 385L300 430" class="line"/><path d="M560 385V430" class="line"/><path d="M910 385L820 430" class="line"/>
  <text x="40" y="562" class="b">Legend:</text><rect x="105" y="545" width="22" height="18" class="box impl"/><text x="136" y="559" class="b">Implemented</text><rect x="240" y="545" width="22" height="18" class="box partial"/><text x="271" y="559" class="b">Partially implemented</text><rect x="445" y="545" width="22" height="18" class="box plan"/><text x="476" y="559" class="b">Planned</text>
</svg>
