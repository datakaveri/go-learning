<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">New CDPG service lifecycle</title><desc id="desc">A service advances through charter, contracts, scaffold, implementation, security, local integration, GitOps, and operational evidence gates.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 15px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:13;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="430" fill="#fff"/><text x="40" y="42" class="t">New-service delivery gates</text>
  <g><rect x="35" y="105" width="120" height="90" class="box plan"/><text x="95" y="137" text-anchor="middle" class="h">1 · Charter</text><text x="95" y="163" text-anchor="middle" class="b">owner · data</text><text x="95" y="181" text-anchor="middle" class="b">actors · status</text></g>
  <g><rect x="175" y="105" width="120" height="90" class="box plan"/><text x="235" y="137" text-anchor="middle" class="h">2 · Contracts</text><text x="235" y="163" text-anchor="middle" class="b">OpenAPI · proto</text><text x="235" y="181" text-anchor="middle" class="b">events · ports</text></g>
  <g><rect x="315" y="105" width="120" height="90" class="box impl"/><text x="375" y="137" text-anchor="middle" class="h">3 · Scaffold</text><text x="375" y="163" text-anchor="middle" class="b">layers · config</text><text x="375" y="181" text-anchor="middle" class="b">bootstrap</text></g>
  <g><rect x="455" y="105" width="120" height="90" class="box impl"/><text x="515" y="137" text-anchor="middle" class="h">4 · Data</text><text x="515" y="163" text-anchor="middle" class="b">migrations · tx</text><text x="515" y="181" text-anchor="middle" class="b">outbox · workers</text></g>
  <g><rect x="595" y="105" width="120" height="90" class="box partial"/><text x="655" y="137" text-anchor="middle" class="h">5 · Security</text><text x="655" y="163" text-anchor="middle" class="b">identity · authz</text><text x="655" y="181" text-anchor="middle" class="b">gateway · audit</text></g>
  <g><rect x="735" y="105" width="120" height="90" class="box partial"/><text x="795" y="137" text-anchor="middle" class="h">6 · Local</text><text x="795" y="163" text-anchor="middle" class="b">Compose · smoke</text><text x="795" y="181" text-anchor="middle" class="b">faults · recovery</text></g>
  <g><rect x="875" y="105" width="120" height="90" class="box partial"/><text x="935" y="137" text-anchor="middle" class="h">7 · GitOps</text><text x="935" y="163" text-anchor="middle" class="b">secrets · network</text><text x="935" y="181" text-anchor="middle" class="b">probes · rollout</text></g>
  <path d="M155 150H175M295 150H315M435 150H455M575 150H595M715 150H735M855 150H875" class="line"/>
  <rect x="250" y="265" width="620" height="82" class="box plan"/><text x="560" y="296" text-anchor="middle" class="h">Release review and operational evidence</text><text x="560" y="322" text-anchor="middle" class="b">scorecard · SLOs · restore · rollback · conformance · no unresolved blocker</text><path d="M935 195L830 265" class="line"/>
  <text x="40" y="395" class="b">Legend: green = source workflow · orange = integration evidence required · blue = design/review gate</text>
</svg>
