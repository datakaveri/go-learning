<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">User, workload, and delegated actor identity</title><desc id="desc">Keycloak authenticates user and workload separately. The gateway validates the user and obtains a destination token. The service verifies workload before accepting asserted subject; an agent remains a separate actor.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 16px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="540" fill="#fff"/><text x="40" y="42" class="t">Authentication establishes distinct identities</text>
  <rect x="40" y="105" width="160" height="75" class="box impl"/><text x="120" y="136" text-anchor="middle" class="h">Human subject</text><text x="120" y="160" text-anchor="middle" class="b">OIDC + PKCE</text>
  <rect x="280" y="90" width="200" height="105" class="box impl"/><text x="380" y="124" text-anchor="middle" class="h">Keycloak</text><text x="380" y="150" text-anchor="middle" class="b">JWKS · users · clients</text><text x="380" y="174" text-anchor="middle" class="b">token exchange</text>
  <rect x="565" y="90" width="210" height="105" class="box partial"/><text x="670" y="124" text-anchor="middle" class="h">Gateway workload</text><text x="670" y="150" text-anchor="middle" class="b">validates user token</text><text x="670" y="174" text-anchor="middle" class="b">requests destination token</text>
  <rect x="860" y="90" width="210" height="105" class="box partial"/><text x="965" y="124" text-anchor="middle" class="h">Service</text><text x="965" y="150" text-anchor="middle" class="b">verifies audience/caller</text><text x="965" y="174" text-anchor="middle" class="b">then subject asserter</text>
  <path d="M200 143H280" class="line"/><path d="M480 143H565" class="line"/><path d="M775 143H860" class="line"/>
  <rect x="185" y="285" width="220" height="100" class="box partial"/><text x="295" y="318" text-anchor="middle" class="h">Agent actor</text><text x="295" y="345" text-anchor="middle" class="b">distinct actor + delegation</text><text x="295" y="369" text-anchor="middle" class="b">human remains subject</text>
  <rect x="515" y="285" width="250" height="100" class="box impl"/><text x="640" y="318" text-anchor="middle" class="h">Verified context</text><text x="640" y="345" text-anchor="middle" class="b">subject · actor · organisation</text><text x="640" y="369" text-anchor="middle" class="b">workload · grant · request</text>
  <rect x="855" y="285" width="220" height="100" class="box plan"/><text x="965" y="318" text-anchor="middle" class="h">Binding contract</text><text x="965" y="345" text-anchor="middle" class="b">request-bound subject</text><text x="965" y="369" text-anchor="middle" class="b">artifact still open</text>
  <path d="M380 195L320 285" class="line"/><path d="M405 335H515" class="line"/><path d="M765 335H855" class="line"/>
  <text x="40" y="492" class="b">Legend:</text><rect x="105" y="475" width="22" height="18" class="box impl"/><text x="136" y="489" class="b">Implemented identity authority/value</text><rect x="380" y="475" width="22" height="18" class="box partial"/><text x="411" y="489" class="b">Partial integration</text><rect x="600" y="475" width="22" height="18" class="box plan"/><text x="631" y="489" class="b">Planned contract</text>
</svg>
