<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">dx-common-go platform module map</title><desc id="desc">Platform modules are grouped by kernel, capabilities, adapters, and composition. Business logic remains in services.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 17px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:13px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="590" fill="#fff"/><text x="40" y="42" class="t">Shared platform: infrastructure behavior, not business logic</text>
  <rect x="55" y="85" width="1010" height="72" class="box partial"/><text x="560" y="116" text-anchor="middle" class="h">L3 · composition and adapters</text><text x="560" y="142" text-anchor="middle" class="b">bootstrap · events/amqp · cache/redis · database/sql/pgx · grpc/server</text>
  <rect x="55" y="195" width="1010" height="100" class="box impl"/><text x="560" y="226" text-anchor="middle" class="h">L1–L2 · capabilities and edges</text><text x="560" y="254" text-anchor="middle" class="b">http · grpc client · database/sql · cache · events · idempotency · lease · executor</text><text x="560" y="278" text-anchor="middle" class="b">security/workload · workload/issuer · observability/health</text>
  <rect x="55" y="335" width="1010" height="78" class="box impl"/><text x="560" y="366" text-anchor="middle" class="h">L0 · kernel values</text><text x="560" y="392" text-anchor="middle" class="b">config · errors · paging · security/identity</text>
  <rect x="250" y="458" width="620" height="72" class="box plan"/><text x="560" y="489" text-anchor="middle" class="h">Service domain and application logic</text><text x="560" y="515" text-anchor="middle" class="b">uses platform capabilities; never moves into dx-common-go</text>
  <path d="M560 157V195" class="line"/><path d="M560 295V335" class="line"/><path d="M560 413V458" class="line"/>
  <text x="40" y="566" class="b">Legend: green = implemented module · orange = concrete adapter/adoption varies · blue = service-owned responsibility</text>
</svg>
