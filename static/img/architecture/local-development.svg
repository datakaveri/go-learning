<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">Local CDPG development topology</title><desc id="desc">A developer calls the gateway on its host port. Compose routes internally to the service and shared infrastructure by DNS and container ports. Service repositories and dx-common-go are adjacent inside the orchestration workspace.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 16px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="580" fill="#fff"/><text x="40" y="42" class="t">Local workspace and Compose topology</text>
  <rect x="40" y="90" width="220" height="100" class="box impl"/><text x="150" y="122" text-anchor="middle" class="h">Developer</text><text x="150" y="148" text-anchor="middle" class="b">browser · curl · Go tests</text><text x="150" y="172" text-anchor="middle" class="b">host ports from PORTS.md</text>
  <rect x="345" y="90" width="220" height="100" class="box partial"/><text x="455" y="122" text-anchor="middle" class="h">dx-gateway-go</text><text x="455" y="148" text-anchor="middle" class="b">localhost:8000 → :8080</text><text x="455" y="172" text-anchor="middle" class="b">Compose network DNS</text>
  <rect x="650" y="90" width="220" height="100" class="box partial"/><text x="760" y="122" text-anchor="middle" class="h">Service under test</text><text x="760" y="148" text-anchor="middle" class="b">container port registry</text><text x="760" y="172" text-anchor="middle" class="b">workload verifier</text>
  <path d="M260 140H345M565 140H650" class="line"/>
  <rect x="180" y="285" width="760" height="120" class="box impl"/><text x="560" y="317" text-anchor="middle" class="h">Shared local infrastructure</text><text x="560" y="346" text-anchor="middle" class="b">Keycloak · OpenFGA · PostgreSQL/PostGIS · RabbitMQ · Redis</text><text x="560" y="372" text-anchor="middle" class="b">Elasticsearch · MinIO/S3-compatible storage · telemetry</text><text x="560" y="395" text-anchor="middle" class="b">internal calls use service names and container ports</text>
  <path d="M455 190L410 285M760 190L710 285" class="line"/>
  <rect x="180" y="455" width="760" height="72" class="box plan"/><text x="560" y="486" text-anchor="middle" class="h">Orchestration workspace</text><text x="560" y="511" text-anchor="middle" class="b">orchestrator + adjacent service repos + dx-common-go · nested repos ignored by orchestrator Git</text>
  <text x="40" y="558" class="b">Legend: green = local infrastructure/workspace · orange = service integration · blue = repository topology</text>
</svg>
