<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes GitOps deployment topology</title><desc id="desc">Git changes flow through Argo CD ApplicationSets and a shared Helm chart. A PreSync migration job uses the same image, then the deployment starts with External Secrets, NetworkPolicy, workload identity, probes, metrics, and gateway exposure.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 15px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:13;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="560" fill="#fff"/><text x="40" y="42" class="t">GitOps rollout and runtime controls</text>
  <rect x="35" y="95" width="180" height="78" class="box impl"/><text x="125" y="126" text-anchor="middle" class="h">Git values + image</text><text x="125" y="151" text-anchor="middle" class="b">immutable revision</text>
  <rect x="270" y="95" width="190" height="78" class="box impl"/><text x="365" y="126" text-anchor="middle" class="h">Argo CD</text><text x="365" y="151" text-anchor="middle" class="b">ApplicationSet render</text>
  <rect x="515" y="95" width="210" height="78" class="box impl"/><text x="620" y="126" text-anchor="middle" class="h">Shared Helm chart</text><text x="620" y="151" text-anchor="middle" class="b">service resources</text>
  <rect x="780" y="95" width="305" height="78" class="box partial"/><text x="933" y="126" text-anchor="middle" class="h">Config-check + PreSync migration</text><text x="933" y="151" text-anchor="middle" class="b">same image · one schema actor</text>
  <path d="M215 134H270M460 134H515M725 134H780" class="line"/>
  <rect x="95" y="265" width="930" height="135" class="box partial"/><text x="560" y="298" text-anchor="middle" class="h">Kubernetes service runtime</text><text x="135" y="328" class="b">Deployment + Service · non-root/read-only · probes · resources · PDB/HPA</text><text x="135" y="355" class="b">ExternalSecret · ServiceAccount · workload audiences · caller/subject-asserter allowlists</text><text x="135" y="382" class="b">NetworkPolicy · metrics scrape · topology spread · graceful termination</text>
  <path d="M933 173L850 265" class="line"/>
  <rect x="185" y="450" width="300" height="62" class="box plan"/><text x="335" y="477" text-anchor="middle" class="h">Gateway route enable</text><text x="335" y="499" text-anchor="middle" class="b">after security and smoke gates</text>
  <rect x="635" y="450" width="300" height="62" class="box plan"/><text x="785" y="477" text-anchor="middle" class="h">Observe + rollback drill</text><text x="785" y="499" text-anchor="middle" class="b">SLO · backlog · restore · reconcile</text>
  <path d="M450 400L365 450M670 400L755 450" class="line"/>
  <text x="40" y="540" class="b">Legend: green = implemented GitOps machinery · orange = per-service integration evidence · blue = controlled activation/operations gate</text>
</svg>
