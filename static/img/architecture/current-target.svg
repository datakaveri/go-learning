<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Current and target CDPG developer platform</title><desc id="desc">A left-to-right comparison from current platform modules and relationship checks to target internal gRPC, composite authorization, typed obligations, and production evidence.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 17px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:13px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.partial{fill:#fff4e8;stroke:#f57e20}.impl{fill:#e7f6ef;stroke:#15805d}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="520" fill="#fff"/><text x="40" y="42" class="t">Current state → target state</text>
  <rect x="45" y="85" width="450" height="340" class="box partial"/><text x="270" y="120" text-anchor="middle" class="h">Current evidence</text><text x="80" y="160" class="b">✓ platform bootstrap, HTTP, SQL, cache, events, identity</text><text x="80" y="195" class="b">✓ public gateway and destination workload tokens</text><text x="80" y="230" class="b">✓ OpenFGA-backed POST /v1/check</text><text x="80" y="265" class="b">△ internal gRPC adoption</text><text x="80" y="300" class="b">△ service outbox and worker adoption</text><text x="80" y="335" class="b">△ local Agentic Plane integration</text><text x="80" y="370" class="b">△ Data Plane exposure and filtering</text>
  <path d="M495 255H625" class="line"/><text x="560" y="242" text-anchor="middle" class="b">ADRs · APIs · tests</text>
  <rect x="625" y="85" width="450" height="340" class="box plan"/><text x="850" y="120" text-anchor="middle" class="h">Target, not yet operational</text><text x="660" y="160" class="b">○ consistent internal gRPC contracts</text><text x="660" y="195" class="b">○ composite decision IDs, revisions, expiry</text><text x="660" y="230" class="b">○ OPA contextual policy and typed obligations</text><text x="660" y="265" class="b">○ carried Data Plane decision verification</text><text x="660" y="300" class="b">○ GitOps-deployed Agentic Plane</text><text x="660" y="335" class="b">○ complete conformance and recovery evidence</text><text x="660" y="370" class="b">○ production operational proof</text>
  <text x="40" y="478" class="b">Legend:</text><rect x="105" y="461" width="22" height="18" class="box impl"/><text x="136" y="475" class="b">Implemented subset</text><rect x="285" y="461" width="22" height="18" class="box partial"/><text x="316" y="475" class="b">Partial current platform</text><rect x="500" y="461" width="22" height="18" class="box plan"/><text x="531" y="475" class="b">Planned target</text>
</svg>
