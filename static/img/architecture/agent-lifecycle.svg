<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Agent lifecycle and governed tool execution</title><desc id="desc">An owner registers an agent and delegation. Runtime creates a leased session and exchanges a delegated token. MCP Gateway validates tool calls, performs dual authorization, planned contextual policy, human approval for high risk, rechecks kill state, invokes a service, and returns untrusted bounded output.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 14px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:11.5px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:12;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.deny{fill:#fdecec;stroke:#b42318}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="600" fill="#fff"/><text x="40" y="42" class="t">Delegated agent: registration, session, tool, approval, revocation</text>
  <rect x="30" y="92" width="155" height="82" class="box impl"/><text x="108" y="122" text-anchor="middle" class="h">Human owner</text><text x="108" y="146" text-anchor="middle" class="b">register + delegate</text><text x="108" y="162" text-anchor="middle" class="b">approve high risk</text>
  <rect x="225" y="80" width="190" height="106" class="box partial"/><text x="320" y="111" text-anchor="middle" class="h">Agent Registry</text><text x="320" y="136" text-anchor="middle" class="b">template · identity · state</text><text x="320" y="158" text-anchor="middle" class="b">kill · revoke · delegation</text>
  <rect x="455" y="80" width="190" height="106" class="box partial"/><text x="550" y="111" text-anchor="middle" class="h">Agent Runtime</text><text x="550" y="136" text-anchor="middle" class="b">session · SSE · plan loop</text><text x="550" y="158" text-anchor="middle" class="b">durable lease · token exchange</text>
  <rect x="685" y="80" width="200" height="106" class="box partial"/><text x="785" y="111" text-anchor="middle" class="h">MCP Gateway</text><text x="785" y="136" text-anchor="middle" class="b">tool schema · semantic firewall</text><text x="785" y="158" text-anchor="middle" class="b">risk · HITL · invoke</text>
  <rect x="925" y="92" width="165" height="82" class="box partial"/><text x="1008" y="122" text-anchor="middle" class="h">Owning service</text><text x="1008" y="146" text-anchor="middle" class="b">final PEP + effect</text>
  <path d="M185 133H225M415 133H455M645 133H685M885 133H925" class="line"/>
  <rect x="115" y="285" width="200" height="95" class="box partial"/><text x="215" y="315" text-anchor="middle" class="h">Dual authorization</text><text x="215" y="340" text-anchor="middle" class="b">human relation</text><text x="215" y="362" text-anchor="middle" class="b">∩ agent delegated relation</text>
  <rect x="365" y="285" width="180" height="95" class="box plan"/><text x="455" y="315" text-anchor="middle" class="h">OPA context</text><text x="455" y="340" text-anchor="middle" class="b">risk · purpose · tool</text><text x="455" y="362" text-anchor="middle" class="b">planned</text>
  <rect x="595" y="285" width="180" height="95" class="box partial"/><text x="685" y="315" text-anchor="middle" class="h">HITL state</text><text x="685" y="340" text-anchor="middle" class="b">bound · expiring</text><text x="685" y="362" text-anchor="middle" class="b">atomic single use</text>
  <rect x="825" y="285" width="220" height="95" class="box deny"/><text x="935" y="315" text-anchor="middle" class="h">Immediate recheck</text><text x="935" y="340" text-anchor="middle" class="b">kill · revoke · expiry · lease</text><text x="935" y="362" text-anchor="middle" class="b">any failure stops execution</text>
  <path d="M785 186L300 285M785 186L500 285M785 186L700 285M785 186L900 285" class="line"/>
  <rect x="250" y="465" width="620" height="70" class="box partial"/><text x="560" y="493" text-anchor="middle" class="h">Bounded tool result returns as untrusted content with provenance</text><text x="560" y="517" text-anchor="middle" class="b">audit every stage · owner idempotency · reconcile unknown side-effect outcome</text><path d="M1008 174L820 465" class="line"/>
  <text x="40" y="572" class="b">Legend: green = actor · orange = locally integrated partial component/control · blue dashed = planned OPA · red = fail-safe stop gate</text>
</svg>
