<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
  <title id="title">Public REST and internal gRPC boundaries</title><desc id="desc">External clients use HTTPS REST through the gateway. Services use internal gRPC with workload identity where adopted and events for domain facts.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 17px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:13px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.partial{fill:#fff4e8;stroke:#f57e20}.impl{fill:#e7f6ef;stroke:#15805d}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="490" fill="#fff"/><text x="40" y="42" class="t">Transport boundaries</text>
  <rect x="45" y="105" width="190" height="80" class="box impl"/><text x="140" y="136" text-anchor="middle" class="h">External client</text><text x="140" y="162" text-anchor="middle" class="b">browser · CLI · partner</text>
  <rect x="320" y="105" width="220" height="80" class="box partial"/><text x="430" y="136" text-anchor="middle" class="h">Gateway</text><text x="430" y="162" text-anchor="middle" class="b">public PEP</text>
  <rect x="650" y="75" width="215" height="110" class="box partial"/><text x="758" y="108" text-anchor="middle" class="h">Service A</text><text x="758" y="134" text-anchor="middle" class="b">REST adapter</text><text x="758" y="158" text-anchor="middle" class="b">gRPC client</text>
  <rect x="650" y="285" width="215" height="110" class="box partial"/><text x="758" y="318" text-anchor="middle" class="h">Service B</text><text x="758" y="344" text-anchor="middle" class="b">gRPC server</text><text x="758" y="368" text-anchor="middle" class="b">workload verifier</text>
  <rect x="920" y="285" width="150" height="110" class="box impl"/><text x="995" y="318" text-anchor="middle" class="h">RabbitMQ</text><text x="995" y="344" text-anchor="middle" class="b">domain facts</text><text x="995" y="368" text-anchor="middle" class="b">at least once</text>
  <path d="M235 145H320" class="line"/><text x="277" y="132" text-anchor="middle" class="b">HTTPS JSON</text><path d="M540 145H650" class="line"/><text x="595" y="132" text-anchor="middle" class="b">REST</text><path d="M758 185V285" class="line"/><text x="775" y="240" class="b">gRPC target</text><path d="M865 340H920" class="line"/>
  <rect x="910" y="75" width="160" height="70" class="box plan"/><text x="990" y="104" text-anchor="middle" class="h">Streaming gRPC</text><text x="990" y="128" text-anchor="middle" class="b">interceptors planned</text>
  <text x="40" y="450" class="b">Legend:</text><rect x="105" y="433" width="22" height="18" class="box impl"/><text x="136" y="447" class="b">Implemented</text><rect x="240" y="433" width="22" height="18" class="box partial"/><text x="271" y="447" class="b">Partial adoption</text><rect x="425" y="433" width="22" height="18" class="box plan"/><text x="456" y="447" class="b">Planned</text>
</svg>
