<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Planned Data Plane carried-decision enforcement</title><desc id="desc">A gateway or application PEP obtains a composite decision. The Data Plane verifies integrity, binding, expiry, and revisions, translates typed obligations through allowlisted builders, and queries its datastore without a synchronous PDP call.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 16px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.partial{fill:#fff4e8;stroke:#f57e20}.impl{fill:#e7f6ef;stroke:#15805d}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.deny{fill:#fdecec;stroke:#b42318}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="520" fill="#fff"/><text x="40" y="42" class="t">Data Plane authorization: planned carried decision</text>
  <rect x="35" y="105" width="180" height="95" class="box partial"/><text x="125" y="136" text-anchor="middle" class="h">Gateway/app PEP</text><text x="125" y="162" text-anchor="middle" class="b">authenticate + request</text><text x="125" y="184" text-anchor="middle" class="b">composite decision</text>
  <rect x="285" y="90" width="200" height="125" class="box plan"/><text x="385" y="122" text-anchor="middle" class="h">Carried artifact</text><text x="310" y="150" class="b">ID · integrity · audience</text><text x="310" y="174" class="b">bindings · expiry · revisions</text><text x="310" y="198" class="b">typed obligations</text>
  <rect x="555" y="75" width="255" height="155" class="box plan"/><text x="683" y="107" text-anchor="middle" class="h">Data Plane verifier</text><text x="585" y="136" class="b">authentic · current · scoped</text><text x="585" y="161" class="b">subject/actor/org/request bound</text><text x="585" y="186" class="b">all obligations supported</text><text x="585" y="211" class="b">otherwise default deny</text>
  <rect x="880" y="90" width="205" height="125" class="box partial"/><text x="983" y="122" text-anchor="middle" class="h">Safe query builder</text><text x="910" y="150" class="b">typed intersection</text><text x="910" y="174" class="b">allowlisted identifiers</text><text x="910" y="198" class="b">bound values</text>
  <path d="M215 153H285M485 153H555M810 153H880" class="line"/>
  <rect x="390" y="320" width="340" height="82" class="box impl"/><text x="560" y="351" text-anchor="middle" class="h">Owned datastore</text><text x="560" y="377" text-anchor="middle" class="b">Elasticsearch · PostGIS · S3 · subscription state</text><path d="M983 215L700 320" class="line"/>
  <rect x="805" y="320" width="280" height="82" class="box deny"/><text x="945" y="351" text-anchor="middle" class="h">Never accepted</text><text x="945" y="377" text-anchor="middle" class="b">raw SQL · CQL · ES DSL from policy</text>
  <text x="40" y="470" class="b">No synchronous PDP call in the Data Plane query path · green = current datastore · orange = current PEP/builder · blue dashed = planned artifact</text>
</svg>
