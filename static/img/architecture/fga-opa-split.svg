<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenFGA and OPA responsibility split</title><desc id="desc">OpenFGA evaluates relationships today. OPA is planned for bounded contextual policy. dx-authz-go composes them and application policy enforcement points apply decisions and typed obligations.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 17px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="520" fill="#fff"/><text x="40" y="42" class="t">Relationship graph and contextual policy stay separate</text>
  <rect x="410" y="82" width="300" height="95" class="box partial"/><text x="560" y="114" text-anchor="middle" class="h">dx-authz-go · composite PDP</text><text x="560" y="141" text-anchor="middle" class="b">current: relationship check</text><text x="560" y="163" text-anchor="middle" class="b">target: orchestration + decision metadata</text>
  <rect x="80" y="245" width="380" height="150" class="box impl"/><text x="270" y="278" text-anchor="middle" class="h">OpenFGA · Implemented</text><text x="115" y="309" class="b">owns: tuples, model, ownership, membership</text><text x="115" y="335" class="b">evaluates: subject–relation–object graph</text><text x="115" y="361" class="b">not: authn, context filters, quotas, enforcement</text>
  <rect x="660" y="245" width="380" height="150" class="box plan"/><text x="850" y="278" text-anchor="middle" class="h">OPA · Planned</text><text x="695" y="309" class="b">target: purpose, risk, time, network, tool guardrails</text><text x="695" y="335" class="b">selects: typed obligations and stable reasons</text><text x="695" y="361" class="b">not: authn, tuples, DB queries, raw SQL, side effects</text>
  <path d="M500 177L350 245" class="line"/><path d="M620 177L770 245" class="line"/>
  <rect x="355" y="430" width="410" height="55" class="box partial"/><text x="560" y="463" text-anchor="middle" class="h">Gateway / application / Data Plane PEP enforces</text><path d="M560 177V430" class="line"/>
  <text x="40" y="505" class="b">Legend: green = implemented engine · orange = partial composite/enforcement path · blue dashed = planned engine responsibility</text>
</svg>
