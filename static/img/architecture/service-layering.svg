<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">Required CDPG Go service dependency layers</title><desc id="desc">Transport adapters call application use cases, which depend on domain and consumer-owned ports. Repository and integration adapters implement ports. Main composes everything with the shared platform.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 17px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:13px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.partial{fill:#fff4e8;stroke:#f57e20}.impl{fill:#e7f6ef;stroke:#15805d}.plan{fill:#eef1f8;stroke:#6074a9}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="590" fill="#fff"/><text x="40" y="42" class="t">Service layering and dependency direction</text>
  <rect x="395" y="72" width="330" height="68" class="box impl"/><text x="560" y="101" text-anchor="middle" class="h">cmd/server · composition root</text><text x="560" y="124" text-anchor="middle" class="b">bootstrap.Spec · adapters · lifecycle</text>
  <rect x="100" y="190" width="350" height="82" class="box partial"/><text x="275" y="221" text-anchor="middle" class="h">Transport adapters</text><text x="275" y="247" text-anchor="middle" class="b">HTTP · gRPC · bind · map · enforce edge</text>
  <rect x="670" y="190" width="350" height="82" class="box partial"/><text x="845" y="221" text-anchor="middle" class="h">Infrastructure adapters</text><text x="845" y="247" text-anchor="middle" class="b">PostgreSQL · clients · events · cache · workers</text>
  <rect x="310" y="330" width="500" height="82" class="box plan"/><text x="560" y="361" text-anchor="middle" class="h">Application use cases and ports</text><text x="560" y="387" text-anchor="middle" class="b">orchestration · transaction · authorization · consumer interfaces</text>
  <rect x="395" y="465" width="330" height="68" class="box impl"/><text x="560" y="494" text-anchor="middle" class="h">Domain</text><text x="560" y="518" text-anchor="middle" class="b">entities · values · invariants · domain errors</text>
  <path d="M500 140L310 190" class="line"/><path d="M620 140L810 190" class="line"/><path d="M275 272L465 330" class="line"/><path d="M845 272L655 330" class="line"/><path d="M560 412V465" class="line"/>
  <text x="40" y="566" class="b">Legend: arrows point inward · green = stable core/platform behavior · orange = adapter adoption varies · blue = required new-service structure</text>
</svg>
