<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Composite authorization decision flow</title><desc id="desc">A policy enforcement point sends verified subject, actor, organisation, resource, action, and context to the authorization service. OpenFGA and planned OPA results are combined into a default-deny typed decision that the PEP enforces and audits.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 16px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.deny{fill:#fdecec;stroke:#b42318}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="500" fill="#fff"/><text x="40" y="42" class="t">Composite authorization: target flow</text>
  <rect x="35" y="105" width="225" height="120" class="box partial"/><text x="148" y="137" text-anchor="middle" class="h">PEP input</text><text x="65" y="164" class="b">subject · actor · delegation</text><text x="65" y="188" class="b">organisation · resource · action</text><text x="65" y="212" class="b">bounded request context</text>
  <rect x="340" y="85" width="250" height="160" class="box partial"/><text x="465" y="117" text-anchor="middle" class="h">dx-authz-go</text><text x="370" y="146" class="b">validate input and mapping</text><text x="370" y="171" class="b">orchestrate evaluators</text><text x="370" y="196" class="b">intersect delegation</text><text x="370" y="221" class="b">default deny on any gap</text>
  <rect x="685" y="75" width="185" height="72" class="box impl"/><text x="778" y="105" text-anchor="middle" class="h">OpenFGA</text><text x="778" y="130" text-anchor="middle" class="b">relationship result</text>
  <rect x="685" y="180" width="185" height="72" class="box plan"/><text x="778" y="210" text-anchor="middle" class="h">OPA</text><text x="778" y="235" text-anchor="middle" class="b">context + obligations</text>
  <rect x="925" y="85" width="165" height="160" class="box plan"/><text x="1008" y="117" text-anchor="middle" class="h">Typed decision</text><text x="945" y="146" class="b">allow + reason</text><text x="945" y="171" class="b">ID + expiry</text><text x="945" y="196" class="b">revisions</text><text x="945" y="221" class="b">obligations</text>
  <path d="M260 165H340M590 130L685 111M590 200L685 216M870 111L925 145M870 216L925 205" class="line"/>
  <rect x="310" y="335" width="500" height="75" class="box partial"/><text x="560" y="366" text-anchor="middle" class="h">PEP verifies, enforces obligations, executes, audits</text><text x="560" y="391" text-anchor="middle" class="b">unsupported · stale · expired · mismatched · unavailable ⇒ deny</text><path d="M1008 245L780 335" class="line"/>
  <text x="40" y="465" class="b">Legend:</text><rect x="105" y="448" width="22" height="18" class="box impl"/><text x="136" y="462" class="b">Implemented evaluator</text><rect x="315" y="448" width="22" height="18" class="box partial"/><text x="346" y="462" class="b">Partial PEP/PDP path</text><rect x="570" y="448" width="22" height="18" class="box plan"/><text x="601" y="462" class="b">Planned contract</text>
</svg>
