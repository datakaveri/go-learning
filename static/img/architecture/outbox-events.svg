<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Transactional outbox and idempotent event consumption</title><desc id="desc">A domain row and outbox event commit in one PostgreSQL transaction. A leased dispatcher publishes with confirmation to RabbitMQ. An idempotent consumer commits a projection and processed event before acknowledging.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 15px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:13;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="480" fill="#fff"/><text x="40" y="42" class="t">Reliable event delivery: atomic state, at-least-once transport</text>
  <rect x="40" y="100" width="230" height="140" class="box impl"/><text x="155" y="132" text-anchor="middle" class="h">Producer transaction</text><text x="70" y="162" class="b">domain row</text><text x="70" y="187" class="b">outbox envelope + stable ID</text><text x="70" y="212" class="b">commit together or rollback</text>
  <rect x="325" y="100" width="180" height="140" class="box partial"/><text x="415" y="132" text-anchor="middle" class="h">Dispatcher</text><text x="355" y="162" class="b">lease batch</text><text x="355" y="187" class="b">publish confirm</text><text x="355" y="212" class="b">mark sent by token</text>
  <rect x="560" y="125" width="150" height="90" class="box impl"/><text x="635" y="158" text-anchor="middle" class="h">RabbitMQ</text><text x="635" y="184" text-anchor="middle" class="b">at least once</text>
  <rect x="765" y="100" width="315" height="140" class="box partial"/><text x="923" y="132" text-anchor="middle" class="h">Consumer transaction</text><text x="795" y="162" class="b">validate version + event ID</text><text x="795" y="187" class="b">projection / owned side effect</text><text x="795" y="212" class="b">processed ID then acknowledge</text>
  <path d="M270 170H325M505 170H560M710 170H765" class="line"/>
  <rect x="205" y="315" width="260" height="78" class="box plan"/><text x="335" y="346" text-anchor="middle" class="h">Retry · DLQ · replay</text><text x="335" y="371" text-anchor="middle" class="b">preserve event ID and reason</text><path d="M415 240L365 315" class="line"/>
  <rect x="650" y="315" width="260" height="78" class="box plan"/><text x="780" y="346" text-anchor="middle" class="h">Reconciliation</text><text x="780" y="371" text-anchor="middle" class="b">authority ↔ projection drift</text><path d="M923 240L830 315" class="line"/>
  <text x="40" y="445" class="b">Legend: green = durable implemented mechanism · orange = supervised process/adoption varies · blue = recovery control</text>
</svg>
