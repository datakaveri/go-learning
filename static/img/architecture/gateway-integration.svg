<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">Gateway integration and enforcement flow</title><desc id="desc">The gateway validates external identity, strips spoofable context, optionally checks relationships, obtains a destination workload token, and proxies to a service that verifies workload identity and enforces business authorization.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 16px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:14;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="510" fill="#fff"/><text x="40" y="42" class="t">Gateway route and trust flow</text>
  <rect x="35" y="145" width="150" height="76" class="box impl"/><text x="110" y="176" text-anchor="middle" class="h">Client</text><text x="110" y="201" text-anchor="middle" class="b">OIDC bearer</text>
  <rect x="255" y="90" width="300" height="200" class="box partial"/><text x="405" y="121" text-anchor="middle" class="h">dx-gateway-go · PEP</text><text x="285" y="155" class="b">1 · match exact/longest route</text><text x="285" y="181" class="b">2 · required / optional / none</text><text x="285" y="207" class="b">3 · validate token and strip headers</text><text x="285" y="233" class="b">4 · relation check when configured</text><text x="285" y="259" class="b">5 · destination credential and proxy</text>
  <rect x="655" y="90" width="300" height="200" class="box partial"/><text x="805" y="121" text-anchor="middle" class="h">Destination service · PEP</text><text x="685" y="155" class="b">1 · verify workload audience/caller</text><text x="685" y="181" class="b">2 · allow subject asserter</text><text x="685" y="207" class="b">3 · load owned object/state</text><text x="685" y="233" class="b">4 · object authorization</text><text x="685" y="259" class="b">5 · enforce, transact, audit</text>
  <path d="M185 183H255" class="line"/><path d="M555 183H655" class="line"/><text x="605" y="168" text-anchor="middle" class="b">audience-bound call</text>
  <rect x="280" y="350" width="250" height="72" class="box impl"/><text x="405" y="380" text-anchor="middle" class="h">Keycloak + JWKS</text><text x="405" y="405" text-anchor="middle" class="b">user and workload authentication</text><path d="M405 290V350" class="line"/>
  <rect x="680" y="350" width="250" height="72" class="box partial"/><text x="805" y="380" text-anchor="middle" class="h">dx-authz-go + OpenFGA</text><text x="805" y="405" text-anchor="middle" class="b">relationship decision</text><path d="M735 290L770 350" class="line"/>
  <text x="40" y="474" class="b">Legend:</text><rect x="105" y="457" width="22" height="18" class="box impl"/><text x="136" y="471" class="b">Implemented dependency</text><rect x="315" y="457" width="22" height="18" class="box partial"/><text x="346" y="471" class="b">Partial enforcement coverage</text><rect x="580" y="457" width="22" height="18" class="box plan"/><text x="611" y="471" class="b">Planned profile extensions</text>
</svg>
