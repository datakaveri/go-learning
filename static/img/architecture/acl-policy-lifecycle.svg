<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">ACL policy administration and projection lifecycle</title><desc id="desc">An owner creates or revokes a grant in ACL, which validates ownership, commits state and event, publishes to RabbitMQ, and authorization projects the relationship into OpenFGA before enforcement observes it.</desc>
  <defs><style>.t{font:700 24px Poppins,Segoe UI,sans-serif;fill:#1f3569}.h{font:700 15px Poppins,Segoe UI,sans-serif;fill:#1f3569}.b{font:12px Poppins,Segoe UI,sans-serif;fill:#3f4c66}.box{rx:13;stroke-width:2}.impl{fill:#e7f6ef;stroke:#15805d}.partial{fill:#fff4e8;stroke:#f57e20}.plan{fill:#eef1f8;stroke:#6074a9;stroke-dasharray:7 5}.line{stroke:#8794b8;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8794b8"/></marker></defs>
  <rect width="1120" height="470" fill="#fff"/><text x="40" y="42" class="t">Policy lifecycle: administration → projection → enforcement</text>
  <rect x="35" y="120" width="140" height="78" class="box impl"/><text x="105" y="151" text-anchor="middle" class="h">Owner/admin</text><text x="105" y="176" text-anchor="middle" class="b">create · revoke</text>
  <rect x="225" y="95" width="210" height="128" class="box partial"/><text x="330" y="127" text-anchor="middle" class="h">dx-acl-go · PAP</text><text x="330" y="153" text-anchor="middle" class="b">ownership · subject · expiry</text><text x="330" y="177" text-anchor="middle" class="b">grant + event transaction</text><text x="330" y="201" text-anchor="middle" class="b">authoritative policy state</text>
  <rect x="500" y="120" width="150" height="78" class="box impl"/><text x="575" y="151" text-anchor="middle" class="h">RabbitMQ</text><text x="575" y="176" text-anchor="middle" class="b">policy.*</text>
  <rect x="715" y="95" width="190" height="128" class="box partial"/><text x="810" y="127" text-anchor="middle" class="h">dx-authz-go</text><text x="810" y="153" text-anchor="middle" class="b">validate · deduplicate</text><text x="810" y="177" text-anchor="middle" class="b">write/remove tuple</text><text x="810" y="201" text-anchor="middle" class="b">reconcile</text>
  <rect x="955" y="120" width="135" height="78" class="box impl"/><text x="1023" y="151" text-anchor="middle" class="h">OpenFGA</text><text x="1023" y="176" text-anchor="middle" class="b">relationships</text>
  <path d="M175 159H225M435 159H500M650 159H715M905 159H955" class="line"/>
  <rect x="325" y="300" width="470" height="74" class="box plan"/><text x="560" y="330" text-anchor="middle" class="h">Projection revision / watermark API</text><text x="560" y="355" text-anchor="middle" class="b">not yet available · poll bounded check · never bypass while pending</text><path d="M810 223L720 300" class="line"/>
  <text x="40" y="430" class="b">Legend: green = implemented dependency · orange = partial workflow/adoption · blue dashed = planned projection contract</text>
</svg>
